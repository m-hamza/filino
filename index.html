<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="فایلینو — مارکت‌پلیس تخصصی محصولات دیجیتال وردپرس؛ قالب، افزونه، رابط کاربری و گرافیک با پشتیبانی فارسی." />
    <title>فایلینو | مارکت محصولات دیجیتال وردپرس</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='44' height='44' rx='10' fill='%230f2027'/%3E%3Crect x='14' y='6' width='44' height='44' rx='10' fill='%23efa33a'/%3E%3Cpath d='M27 18h18v6H35v5h9v6h-9v9h-8z' fill='%230f2027'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="fl-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#060e11;z-index:99">
        <div style="width:46px;height:46px;border-radius:12px;background:#efa33a;display:grid;place-items:center;animation:flpulse 1.1s ease-in-out infinite">
          <span style="color:#0a161b;font-weight:900;font-size:24px;font-family:Vazirmatn,Tahoma,sans-serif">ف</span>
        </div>
        <p style="margin:0;font-size:13px;color:#8faba7;font-family:Vazirmatn,Tahoma,sans-serif">در حال بارگذاری فایلینو…</p>
        <style>@keyframes flpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.65}}</style>
      </div>
    </div>
    <script>
      /* اگر اسکریپت اصلی خطا داد، صفحه سفید نماند */
      window.addEventListener("error", function (e) {
        var b = document.getElementById("fl-boot");
        if (b) {
          b.innerHTML =
            '<div style="text-align:center;font-family:Vazirmatn,Tahoma,sans-serif;color:#eef6f4;padding:0 24px;line-height:2.2">' +
            '<p style="font-size:15px;font-weight:800">خطایی هنگام بارگذاری رخ داد</p>' +
            '<p style="font-size:12px;color:#8faba7">لطفاً صفحه را نوسازی کنید؛ اگر تکرار شد، کش مرورگر را پاک کنید.</p>' +
            '<code dir="ltr" style="display:inline-block;margin-top:8px;font-size:11px;color:#f8bc5b;background:#0d1c22;padding:6px 12px;border-radius:8px">' +
            (e.message || "script error") + "</code></div>";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
